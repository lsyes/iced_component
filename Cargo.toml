[package]
name = "iced_component"
description = "Extra components for iced"
version = "0.1.2"
edition = "2024"
license = "MIT"
repository = "https://github.com/iced-component"
keywords = ["gui", "widgets", "iced"]

[dependencies]
iced_widget = "0.14"
iced_core = "0.14"

[dev-dependencies]
iced = { version = "0.14", default-features = false, features = [
    "wgpu",
    "x11",
    "wayland",
    "thread-pool",
    "fira-sans",
] }
iced_test = "0.14"
iced_tiny_skia = "0.14"
tiny-skia = "0.11"
bytemuck = "1"
